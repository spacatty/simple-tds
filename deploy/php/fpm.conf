[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 24
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 20s
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
security.limit_extensions = .php

; Uploaded code may only touch its own files and /tmp, and may not start processes.
php_admin_value[open_basedir] = /data/whitepages:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,proc_nice,proc_terminate,proc_get_status,dl,putenv,symlink,link,posix_kill,posix_setuid,posix_setgid,mail
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[session.save_path] = /tmp
php_admin_value[memory_limit] = 64M
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
