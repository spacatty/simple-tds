server:
    interface: 0.0.0.0
    # Unprivileged: the container runs without capabilities.
    port: 5353
    do-ip6: no
    username: ""
    chroot: ""
    pidfile: ""
    logfile: ""
    use-syslog: no
    verbosity: 1
    # Take the socket buffers the system gives: asking for more needs root.
    so-rcvbuf: 0
    so-sndbuf: 0

    # Reachable from the compose network only; no port is published.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # Plain recursion. Blocklist answers are read as codes, not trusted as
    # addresses, so DNSSEC validation (and its writable trust anchor) is left out.
    module-config: "iterator"
    hide-identity: yes
    hide-version: yes

    # A listing is worth re-asking only now and then; "not listed" is the usual
    # answer and is cached too. Keeps the query volume the lists see low.
    cache-min-ttl: 300
    cache-max-negative-ttl: 900
    msg-cache-size: 8m
    rrset-cache-size: 16m
    num-threads: 1

remote-control:
    control-enable: no
